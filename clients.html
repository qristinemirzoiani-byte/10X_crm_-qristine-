<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- ნავიგაცია -->
    <nav class="sidebar">
        <div class="logo">10X CRM</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <!-- აქ ვუთითებთ class="active" რადგან Clients გვერდზე ვართ -->
            <li><a href="clients.html" class="active">Clients</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
        <div class="nav-bottom">
            <button id="themeToggle" class="btn-secondary">Light Mode</button>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <!-- მთავარი კონტენტი -->
    <main class="main-content">
        <!-- ჰედერი -->
        <div class="header-section" style="margin-bottom: 1rem;">
            <h1>Clients</h1>
            <button class="btn add-client-btn" id="addClientBtn" style="width: auto; margin: 0;">+ Add Client</button>
        </div>

        <!-- Toolbar: ძებნა, ფილტრები, სორტირება -->
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search by name or company..." class="search-input">
            
            <div class="filter-chips">
                <button class="chip active" data-filter="All">All</button>
                <button class="chip" data-filter="Lead">Lead</button>
                <button class="chip" data-filter="Contacted">Contacted</button>
                <button class="chip" data-filter="Won">Won</button>
                <button class="chip" data-filter="Lost">Lost</button>
            </div>

            <select id="sortSelect" class="sort-select">
                <option value="newest">Sort: Newest first</option>
                <option value="name">Name A-Z</option>
                <option value="deal-high">Deal value: high -> low</option>
            </select>
        </div>

        <!-- ჩატვირთვის ინდიკატორი -->
        <div id="loadingIndicator" class="loading-text" style="display: none;">Loading clients...</div>

        <!-- კლიენტების ბარათების კონტეინერი -->
        <div class="clients-grid" id="clientsContainer">
            <!-- JS დახატავს ბარათებს აქ -->
        </div>
    </main>

    <!-- Add Client Modal (P4.4) -->
    <div id="addClientModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Add New Client</h2>
            <form id="addClientForm" novalidate>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="newClientName" placeholder="John Doe">
                    <span class="error-text" id="errName"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="newClientEmail" placeholder="john@example.com">
                    <span class="error-text" id="errEmail"></span>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="newClientPhone" placeholder="+1 234 567 890">
                    <span class="error-text" id="errPhone"></span>
                </div>
                <div class="form-group">
                    <label>Company (Optional)</label>
                    <input type="text" id="newClientCompany" placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label>Deal Value ($)</label>
                    <input type="number" id="newClientDeal" placeholder="5000">
                    <span class="error-text" id="errDeal"></span>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="newClientStatus" class="sort-select" style="width: 100%;">
                        <option value="Lead" selected>Lead</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button type="button" class="btn-secondary" id="closeModalBtn" style="flex: 1;">Cancel</button>
                    <button type="submit" class="btn" style="flex: 1;">Save Client</button>
                </div>
            </form>
        </div>
    </div>

    <!-- სკრიპტები -->
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
