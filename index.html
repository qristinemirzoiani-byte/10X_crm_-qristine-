<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - 10X CRM</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="toast-container"></div>

    <div class="auth-container">
        <div class="logo-brand">
            <div class="logo-badge">
                <span class="logo-text">10X</span>
                <div class="logo-underline"></div>
            </div>
        </div>
        <h2>Welcome back</h2>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <input type="email" id="emailInput" placeholder="Email">
                <span class="error-text" id="loginEmailError"></span>
            </div>

            <div class="form-group">
                <div class="password-input-container">
                    <input type="password" id="passwordInput" placeholder="Password">
                    <button type="button" class="toggle-password-btn" data-target="passwordInput" aria-label="Show password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <span class="error-text" id="loginPasswordError"></span>
            </div>

            <!-- Global login error message -->
            <span class="error-text global-error-text" id="loginGlobalError"></span>

            <button type="submit" class="btn">Log In</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
