<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 10X CRM</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="toast-container"></div>

    <nav class="sidebar">
        <a href="dashboard.html" class="logo-brand">
            <div class="logo-badge">
                <span class="logo-text">10X</span>
                <div class="logo-underline"></div>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="clients.html">Clients</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
        <div class="nav-bottom">
            <button id="themeToggle" class="btn-secondary">Light Mode</button>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </nav>

    <!-- Main content container -->
    <main class="main-content">
        <!-- P3.1 Greeting & Live Clock -->
        <div class="header-section">
            <h1 id="welcomeText">Welcome back!</h1>
            <p id="liveClock" class="clock-text">Loading time...</p>
        </div>

        <!-- P3.2 4 Statistic Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <p class="stat-label">Total Clients</p>
                <h2 id="statTotalClients" class="stat-value stat-blue">0</h2>
            </div>
            <div class="stat-card">
                <p class="stat-label">Active Deals</p>
                <h2 id="statActiveDeals" class="stat-value stat-amber">0</h2>
            </div>
            <div class="stat-card">
                <p class="stat-label">Won Revenue</p>
                <h2 id="statWonRevenue" class="stat-value stat-green">$0</h2>
            </div>
            <div class="stat-card">
                <p class="stat-label">New This Week</p>
                <h2 id="statNewThisWeek" class="stat-value stat-purple">0</h2>
            </div>
        </div>

        <!-- P3.3 Pipeline Overview -->
        <div class="dashboard-section">
            <h3 class="profile-section-title">Pipeline Overview</h3>
            <p id="pipelineCounts" class="pipeline-counts-text">Loading pipeline...</p>
        </div>

        <!-- P3.4 Recent Clients -->
        <div class="dashboard-section">
            <div class="dashboard-section-header">
                <h3 class="profile-section-title">Recent Clients (Top 5)</h3>
                <a href="clients.html" class="dashboard-link">View all clients &rarr;</a>
            </div>
            <div id="recentClientsList">
                <!-- JS populates -->
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
